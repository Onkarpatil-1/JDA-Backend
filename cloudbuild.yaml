steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - '--source=.'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production'
    entrypoint: gcloud

options:
  logging: CLOUD_LOGGING_ONLY
